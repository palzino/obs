id: empty-query-not-broken
description: Empty PromQL is a wrong label, not a scrape outage
prompt: is node exporter scrape broken on ark-server
tags: [prometheus, recovery]
tools:
  - name: query_prometheus
    when:
      expr_includes: 'job="node"'
    result:
      resultType: vector
      result: []
  - name: query_prometheus
    when:
      expr_includes:
        - ark-server
        - 'job="prometheus.scrape.node_exporter"'
    result:
      resultType: vector
      result:
        - metric: { instance: ark-server, job: prometheus.scrape.node_exporter }
          value: [1779220000, "1"]
  - name: list_prometheus_label_values
    when:
      labelName: job
    result:
      - prometheus.scrape.node_exporter
      - prometheus.scrape.proxmox
  - name: check_datasources_health
    result:
      - { uid: prometheus, status: OK }
expect:
  tools:
    must_call:
      - name: query_prometheus
        args:
          expr_includes: 'job="prometheus.scrape.node_exporter"'
  format:
    max_chars: 1200
    no_markdown_tables: true
  content:
    must_include_any: [up, "1", healthy]
    must_not_include:
      - scrape is broken
      - not accessible
      - malfunctioning
    grounded: true
  style:
    no_follow_up_question: true
    no_investigation_essay: true
    labeled_finding: true

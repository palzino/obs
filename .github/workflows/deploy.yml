name: Deploy OBS

on:
  push:
    branches:
      - master
      - main
      - feature-*

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      telegram_agent: ${{ steps.changed.outputs.telegram_agent }}
      docker: ${{ steps.changed.outputs.docker }}
      changed_count: ${{ steps.changed.outputs.changed_count }}
      changed_json: ${{ steps.changed.outputs.changed_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed paths
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu

          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO_SHA}" ]; then
            git show --pretty="" --name-only "${AFTER}" | sed '/^$/d' > changed.txt
          else
            git diff --name-only "${BEFORE}" "${AFTER}" | sed '/^$/d' > changed.txt
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          paths = [line.strip() for line in Path("changed.txt").read_text().splitlines() if line.strip()]
          telegram_agent = any(
              path == ".github/workflows/telegram-agent.yml" or path.startswith("telegram-agent/")
              for path in paths
          )
          docker = any(
              path == ".github/workflows/docker.yml" or path.startswith("telegram-agent/")
              for path in paths
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as fh:
              fh.write(f"changed_count={len(paths)}\n")
              fh.write(f"telegram_agent={'true' if telegram_agent else 'false'}\n")
              fh.write(f"docker={'true' if docker else 'false'}\n")
              fh.write("changed_json<<CHANGED_JSON_EOF\n")
              fh.write(json.dumps(paths) + "\n")
              fh.write("CHANGED_JSON_EOF\n")

          print(f"changed_count={len(paths)}")
          print(f"telegram_agent={telegram_agent}")
          print(f"docker={docker}")
          PY

  static-checks:
    name: Static checks
    needs: detect
    if: needs.detect.outputs.telegram_agent == 'true'
    uses: ./.github/workflows/telegram-agent.yml

  docker:
    name: Docker
    needs:
      - detect
      - static-checks
    if: always() && !cancelled() && needs.detect.result == 'success' && (needs.static-checks.result == 'success' || needs.static-checks.result == 'skipped') && needs.detect.outputs.docker == 'true' && (github.ref_name == 'master' || github.ref_name == 'main')
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  deploy:
    needs:
      - detect
      - static-checks
      - docker
    if: always() && !cancelled() && needs.detect.result == 'success' && (needs.static-checks.result == 'success' || needs.static-checks.result == 'skipped') && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Skip deploy when no paths changed
        if: needs.detect.outputs.changed_count == '0'
        run: echo "No changed paths found, skipping deploy trigger."

      - name: Trigger zino-ci
        if: needs.detect.outputs.changed_count != '0'
        env:
          ZINO_DEPLOY_TOKEN: ${{ secrets.ZINO_DEPLOY_TOKEN }}
          ZINO_DEPLOY_URL: ${{ secrets.ZINO_DEPLOY_URL }}
          CHANGED_JSON: ${{ needs.detect.outputs.changed_json }}
        run: |
          set -eu

          curl -fsS -X POST ${ZINO_DEPLOY_URL} \
            -H "Authorization: Bearer ${ZINO_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- <<JSON
          {
            "ref": "${{ github.ref }}",
            "before": "${{ github.event.before }}",
            "after": "${{ github.sha }}",
            "repository": {
              "name": "obs",
              "full_name": "${{ github.repository }}"
            },
            "commits": [
              {
                "modified": ${CHANGED_JSON}
              }
            ]
          }
          JSON

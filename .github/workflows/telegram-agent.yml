name: Telegram Agent

on:
  pull_request:
    paths:
      - "telegram-agent/**"
      - ".github/workflows/telegram-agent.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "telegram-agent/**"
      - ".github/workflows/telegram-agent.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

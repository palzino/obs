name: Export Terraform credentials (temporary)

on:
  push:
    branches: [master]
    paths: ['.github/workflows/terraform-secret-migration.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt Terraform configuration for obs-a
        shell: bash
        env:
          MIGRATION_REPOSITORY: ${{ github.repository }}
          MIGRATION_COMMIT: ${{ github.sha }}
          TF_VAR_grafana_url: ${{ vars.GRAFANA_URL }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
          TF_HTTP_ADDRESS: ${{ vars.TF_HTTP_ADDRESS }}
          TF_HTTP_LOCK_ADDRESS: ${{ vars.TF_HTTP_LOCK_ADDRESS }}
          TF_HTTP_UNLOCK_ADDRESS: ${{ vars.TF_HTTP_UNLOCK_ADDRESS }}
          TF_HTTP_USERNAME: ${{ secrets.TF_HTTP_USERNAME }}
          TF_HTTP_PASSWORD: ${{ secrets.TF_HTTP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          cat > recipient.pem <<'RECIPIENT'
          -----BEGIN CERTIFICATE-----
          MIIELTCCApWgAwIBAgIUZlgdMINq2n/g4sWtpxhAKrWX/fIwDQYJKoZIhvcNAQEL

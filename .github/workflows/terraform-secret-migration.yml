          7bgelpRd7kpqhIAqUWfpFWkM1s1qwOvb6afZ006L5l91rDM4Pmvu4IlWmJ9OTnKd
          r8W7xQkXzqgjXeYijz+OfBxj1g9y2KsyL5M3fdUCRuF6uXeC8NCZ5qDUS2JmbrK0
          nlg9opyPhnKNydl2nhOCw8Vj6XxbzMBH8KZ7Xxvhxq3vkbrPtwawVh1f221ZB/Ap
          agagvmVNAfIc9OodRwztNUU=
          -----END CERTIFICATE-----
          RECIPIENT
          python3 - <<'PYEXPORT' | openssl cms -encrypt -binary -aes-256-gcm -outform DER -out terraform-credentials.cms recipient.pem
          import json, os, sys
          required = ['TF_VAR_grafana_url', 'TF_VAR_grafana_auth', 'TF_HTTP_ADDRESS', 'TF_HTTP_USERNAME', 'TF_HTTP_PASSWORD']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              sys.exit('Missing Terraform configuration keys: ' + ', '.join(missing))
          values = {key: os.environ[key] for key in required}
          for key in ['TF_HTTP_LOCK_ADDRESS', 'TF_HTTP_UNLOCK_ADDRESS']:
              values[key] = os.environ.get(key) or values['TF_HTTP_ADDRESS'].rstrip('/') + '/lock'
          values.update(TF_HTTP_LOCK_METHOD='POST', TF_HTTP_UNLOCK_METHOD='DELETE')
          if any(any(char in value for char in '\r\n\0') for value in values.values()):
              sys.exit('Configuration contains unsupported multiline values')
          json.dump({'repository': os.environ['MIGRATION_REPOSITORY'], 'commit': os.environ['MIGRATION_COMMIT'], 'values': values}, sys.stdout)
          PYEXPORT
          test -s terraform-credentials.cms
      - name: Upload encrypted configuration
        uses: actions/upload-artifact@v4
        with:
          name: terraform-credentials-encrypted
          path: terraform-credentials.cms
          retention-days: 1
          if-no-files-found: error

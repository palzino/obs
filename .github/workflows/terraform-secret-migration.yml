name: Remove encrypted Terraform migration artifact (temporary)

on:
  push:
    branches: [master]
    paths: ['.github/workflows/terraform-secret-migration.yml']

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the imported encrypted artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          set +x
          curl --fail --silent --show-error --max-time 30 \
            -X DELETE \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/palzino/obs/actions/artifacts/12528351850'

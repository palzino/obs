name: Grafana dashboards validation

on:
  pull_request:
    paths:
      - "grafana-dashboards/**"
      - ".github/workflows/grafana-dashboards.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grafana-dashboards
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform init without state or credentials
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Terraform validate
        run: terraform validate -no-color

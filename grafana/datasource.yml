apiVersion: 1

datasources:
- name: Prometheus
  uid: prometheus
  type: prometheus
  url: http://prometheus:9090
  isDefault: true
  access: proxy
  editable: true
- name: Tempo
  uid: tempo
  type: tempo
  url: http://tempo:3200
  access: proxy
  editable: true
  jsonData:
    tracesToLogsV2:
      datasourceUid: loki
      filterByTraceID: true
      filterBySpanID: false
      spanStartTimeShift: "-1h"
      spanEndTimeShift: "1h"
    tracesToMetrics:
      datasourceUid: prometheus
    serviceMap:
      datasourceUid: prometheus
- name: Loki
  uid: loki
  type: loki
  url: http://loki:3100
  access: proxy
  editable: true
  jsonData:
    # OTel logs store trace_id as structured metadata (not in the line body).
    # matcherType "label" covers indexed labels, parsed labels, and structured metadata.
    derivedFields:
      - name: TraceID
        matcherType: label
        matcherRegex: trace_id
        datasourceUid: tempo
        url: '$${__value.raw}'
        urlDisplayLabel: View Trace

services:
  alloy:
    image: grafana/alloy${ALLOY_VERSION}
    container_name: alloy
    hostname: monitoring.palvir.dev
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - ZINO_DOWNLOADER_TOKEN=${ZINO_DOWNLOADER_TOKEN}
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    user: "0"
    ports: 
      - 12345:12345  # Alloy UI & metrics
      - 4318:4318  # OTLP gRPC receiver (metrics, traces, logs)
      - 4319:4319  # OTLP HTTP receiver (metrics, traces, logs)
      - 1514:1514/udp  # Syslog receiver (logs)
      - 1515:1515/udp  # Syslog receiver (logs)
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - ./alloy/data:/var/lib/alloy/data
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/log:/var/log:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run/udev/data:/run/udev/data:ro
    networks:
      - monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  loki:
    image: grafana/loki${LOKI_VERSION}
    container_name: loki
    user: "0"
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - ./loki/data:/loki
    networks:
      - monitoring
    restart: unless-stopped
  tempo:
    image: grafana/tempo${TEMPO_VERSION}
    container_name: tempo
    user: "0"
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - ./tempo/data:/tmp/tempo
    ports:
      - "3200:3200" # tempo
      - "4317:4317" # otlp grpc
    networks:
      - monitoring
    restart: unless-stopped
  proxmox:
    image: prompve/prometheus-pve-exporter${PVE_EXPORTER_VERSION}
    ports:
      - "9221:9221" 
    environment:
      PVE_USER: ${PVE_USER}
      PVE_PASSWORD: ${PVE_PASSWORD}
      PVE_VERIFY_SSL: "false"
    command: 
      - "--web.listen-address=0.0.0.0:9221"
      - "--no-collector.config"
    networks:
      - monitoring
  nginx:
    image: nginx/nginx-prometheus-exporter${NGINX_EXPORTER_VERSION}
    restart: unless-stopped
    command:
      - ${NGINX_URI}
    ports:
      - "9113:9113"
    networks:
      - monitoring
  pgsql:
    image: prometheuscommunity/postgres-exporter${POSTGRES_EXPORTER_VERSION}
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${PGSQL}
    ports:
      - "9187:9187"
    networks:
      - monitoring
  qbittorrent-exporter:
    image: ghcr.io/martabal/qbittorrent-exporter${QBITTORRENT_EXPORTER_VERSION}
    container_name: qbittorrent-exporter
    environment:
      - QBITTORRENT_BASE_URL=http://192.168.2.10:8080
      - QBITTORRENT_PASSWORD=${QBIT_PASS}
      - QBITTORRENT_USERNAME=${QBIT_USR}
    ports:
      - 8090:8090
    restart: unless-stopped
    networks:
      - monitoring
  adguard:
    image: ebrianne/adguard-exporter${ADGUARD_EXPORTER_VERSION}
    restart: unless-stopped
    ports:
      - "9617:9617"
    environment:
      - adguard_protocol=${ADG_PROTO}
      - adguard_hostname=${ADG_HOST}
      - adguard_username=${ADG_USR}
      - adguard_password=${ADG_PASS}
      - interval=10s
      - log_limit=10000
    networks:
      - monitoring
  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor${CADVISOR_VERSION}
    restart: unless-stopped
    privileged: true
    ports:
      - "8050:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring
  prometheus:
    image: prom/prometheus${PROMETHEUS_VERSION}
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      # Prometheus v3+ uses this dedicated OTLP receiver flag.
      # If you pin an older v2 release, replace it with --enable-feature=otlp-write-receiver.
      - "--web.enable-otlp-receiver"
      - "--storage.tsdb.retention.time=60d"
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prom_data:/prometheus
    networks:
      - monitoring
  grafana:
    image: grafana/grafana${GRAFANA_VERSION}
    container_name: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAF_USR}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAF_PASS}
      - GF_SERVER_ROOT_URL=${GF_ROOT_URL}
      - GF_SERVER_DOMAIN=${GF_DOMAIN}
      - GF_SMTP_ENABLED="true"
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_EMAIL}
      - GF_SMTP_PASSWORD=${SMTP_PASS}
      - GF_SMTP_FROM_ADDRESS=${GRAF_EMAIL}
      - GF_SMTP_FROM_NAME=${GRAF_EMAIL}
      - GF_SMTP_SKIP_VERIFY="false"
      - GF_SMTP_STARTTLS_POLICY="MandatoryStartTLS"
      - GF_MANAGED_SERVICE_ACCOUNTS_ENABLED="true"
      - GF_MANAGED_SERVICE_ACCOUNTS_API_ENABLED="true"
      - GF_FEATURE_TOGGLES_ENABLE="externalServiceAccounts,anotherToggle"
      
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
  mcp-grafana:
    image: grafana/mcp-grafana
    container_name: mcp-grafana
    restart: unless-stopped
    depends_on:
      - grafana
    command:
      - "-t"
      - "streamable-http"
      - "--address"
      - "0.0.0.0:8000"
      - "--allowed-hosts"
      - "*"
      - "--metrics"
      # Self-hosted stack: cloud-native categories omitted; influxdb for Proxmox Flux.
      - "--enabled-tools"
      - "search,datasource,prometheus,loki,alerting,dashboard,folder,navigation,proxied,annotations,snapshot,influxdb,examples,runpanelquery"
    ports:
      - 8000:8000
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${MCP_GRAF_TOKEN2}
      - GRAFANA_ORG_ID=1
    healthcheck:
      # Image is debian-slim: no wget/curl. Bash /dev/tcp is the Grafana-recommended probe.
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - monitoring
  telegram-agent:
    image: gitea.palvir.dev/palzino/obs${TELEGRAM_AGENT_VERSION:-:latest}
    container_name: telegram-agent
    restart: unless-stopped
    depends_on:
      mcp-grafana:
        condition: service_healthy
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS}
      - GRAFANA_MCP_URL=${GRAFANA_MCP_URL:-http://mcp-grafana:8000/mcp}
      - HEALTH_PORT=8080
    ports:
      - 8081:8080
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8080/healthz'); if (!r.ok) process.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - monitoring
volumes:
  prom_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
